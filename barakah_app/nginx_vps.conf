# Konfigurasi Nginx untuk Barakah Economy di VPS
# Lokasi file: /etc/nginx/sites-available/barakah
# Diaktifkan dengan: ln -sf /etc/nginx/sites-available/barakah /etc/nginx/sites-enabled/

# ==========================================
# 0. Global Security Settings
# ==========================================
# Menyembunyikan versi Nginx dari scanner/pentest
server_tokens off;

# ==========================================
# 1. HTTP -> HTTPS Redirect (Port 80)
# ==========================================
server {
    listen 80;
    listen [::]:80;
    server_name barakah.cloud www.barakah.cloud api.barakah.cloud;

    # Verifikasi Let's Encrypt / Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Redirect permanen semua HTTP request ke HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==========================================
# 2. Frontend (https://barakah.cloud)
# ==========================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name barakah.cloud www.barakah.cloud;

    # SSL Certificates (Let's Encrypt default path)
    ssl_certificate /etc/letsencrypt/live/barakah.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/barakah.cloud/privkey.pem;
    
    # Modern TLS Security & Ciphers (A+ Rating)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Defense-in-depth Security Headers
    # SAMEORIGIN memproteksi dari clickjacking sekaligus tetap mengizinkan preview simulator builder
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip Compression (Mempercepat loading web & transfer file hingga 70-80%)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Anti-Cache untuk index.html, version.json, sw.js (Memastikan browser selalu mengambil versi terbaru saat deploy)
    location ~* ^/(index\.html|version\.json|sw\.js)$ {
        client_max_body_size 100M;
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Long-term Cache untuk file JS/CSS/Media React ber-hash unik (/static/...)
    location /static/ {
        client_max_body_size 100M;
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Intercept detail paths for Open Graph metadata generation (WhatsApp / Social Media Crawlers & SPA Hydration)
    location ~* ^/(store|produk|sinergy|ecommerce|kampanye|articles|academy/articles|kelas|event|digital-products|digital-produk|digital_produk|forum|kegiatan)/ {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Media files (Direct serving for WhatsApp/Social Media crawler image previews)
    location /media/ {
        alias /path/to/barakah_app/backend/media/;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Range, Authorization' always;
        add_header 'Cache-Control' 'public, max-age=86400';
    }

    location / {
        client_max_body_size 100M;
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Default html navigation no-cache
        add_header Cache-Control "no-cache, must-revalidate";
    }
}

# ==========================================
# 3. Backend API (https://api.barakah.cloud)
# ==========================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.barakah.cloud;

    client_max_body_size 100M;

    # SSL Certificates (Let's Encrypt default path)
    ssl_certificate /etc/letsencrypt/live/barakah.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/barakah.cloud/privkey.pem;

    # Modern TLS Security & Ciphers (A+ Rating)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # API Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Direct Media serving for API domain
    location /media/ {
        alias /path/to/barakah_app/backend/media/;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Range, Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        add_header 'Cache-Control' 'public, max-age=86400';

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Range, Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # Main Django API Proxy
    location / {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebRTC WHIP (MediaMTX) - Ingest stream live dari HP / Browser
    location ~ ^/whip/(.*) {
        proxy_pass http://localhost:8889/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS headers for WHIP (preflight / OPTIONS)
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PATCH, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
        add_header 'Access-Control-Expose-Headers' 'Location' always;
        
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # HLS Playback (MediaMTX) - Pemutaran live stream penonton
    location ~ ^/hls/(.*) {
        proxy_pass http://localhost:8888/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS headers for HLS segments and playlists
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Range, Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # Static files Django
    location /static/ {
        alias /path/to/barakah_app/backend/static/;
    }
}
