<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.title }}</title>

    <!-- Instant Meta Refresh for standard browsers -->
    <meta http-equiv="refresh" content="0; url={{ target_url }}">

    <!-- Schema.org for Google+ & WhatsApp Preview -->
    <meta itemprop="name" content="{{ product.title }}">
    <meta itemprop="description" content="{{ product.description }}">
    <meta itemprop="image" content="{{ product.thumbnail_url }}">

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:site_name" content="Barakah Economy">
    <meta property="og:type" content="product">
    <meta property="og:url" content="{{ target_url }}">
    <meta property="og:title" content="{{ product.title }}">
    <meta property="og:description" content="{{ product.description }}">
    <meta property="og:image" content="{{ product.thumbnail_url }}">
    <meta property="og:image:secure_url" content="{{ product.thumbnail_url }}">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="600">
    <meta property="og:image:height" content="600">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="{{ target_url }}">
    <meta name="twitter:title" content="{{ product.title }}">
    <meta name="twitter:description" content="{{ product.description }}">
    <meta name="twitter:image" content="{{ product.thumbnail_url }}">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f9fafb;
            color: #111827;
            flex-direction: column;
            text-align: center;
        }

        .loader {
            border: 3px solid #e5e7eb;
            border-top: 3px solid #059669;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        .redirect-text {
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        .btn-link {
            margin-top: 12px;
            display: inline-block;
            font-size: 12px;
            font-weight: bold;
            color: #059669;
            text-decoration: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div class="loader"></div>
    <div class="redirect-text">Membuka produk {{ product.title }}...</div>
    <a href="{{ target_url }}" class="btn-link">Klik di sini jika tidak otomatis dialihkan</a>

    <script>
        var targetUrl = "{{ target_url|safe }}";
        if (targetUrl) {
            window.location.replace(targetUrl);
        }
    </script>
</body>

</html>
